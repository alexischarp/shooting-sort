[package]
name = "shooting-sort"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Desktop app to cull a day of shooting and sort the RAW and JPEG files"
repository = "https://github.com/alexischarp/shooting-sort"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
rawler = "0.8.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
